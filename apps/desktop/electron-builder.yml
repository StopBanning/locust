# Packaging for Locust.
#
# The app is unsigned: there is no certificate, and pretending otherwise would
# only move the warning somewhere less honest. Windows SmartScreen will say the
# publisher is unknown on first run, which is exactly what an unsigned build
# is. NSIS is chosen over a one-file portable exe so the app installs, gets a
# Start-menu entry and its own icon, and can be uninstalled cleanly.
appId: com.automatedworkflow.locust
productName: Locust
copyright: Copyright © 2026 Automated Workflow

# Where installed copies look for a newer version: Locust's own downloads, on
# Cloudflare (src/shared/locust-home.ts says why). It was a public GitHub
# repository of installers until GitHub suspended the account that held it on
# 2026-10-16, and every copy's update check failed with it. The tester lane
# reads latest.yml and "every build" reads beta.yml (src/main/updates.ts);
# _tools/publish-downloads.mjs writes both.
publish:
  provider: generic
  url: https://dl.locust.lol/

directories:
  output: release
  buildResources: resources

# Chromium's own interface text, in the languages Locust is written in (0.495).
# Electron ships 55 of these `.pak` files, 49 MB on disk; Locust's interface is
# English, and Chromium falls back to en-US for any other system language. The
# spelling dictionaries and dates are not these files.
electronLanguages:
  - en-US
  - en-GB

# `out` is what electron-vite produced; the workspace packages are already
# bundled into it. The terminal's PTY is a runtime dependency; its native files are unpacked below.
files:
  - out/**/*
  - package.json
  # The window icon the main process hands BrowserWindow. It was not shipped
  # until 0.32.0, so the packaged window fell back to Electron's own icon in
  # the taskbar (Colin, 2026-09-05: "app icon is showing as electron app").
  - resources/icon-512.png
  # npm itself, so a machine with no Node.js can still install a coding CLI.
  - resources/npm/**/*
  - '!resources/npm/node_modules/.bin/**/*'

# npm has to be real files on disk: it spawns, reads its own package.json and
# writes shims, none of which works from inside the archive.
asarUnpack:
  - node_modules/@lydell/**/*
  - resources/npm/**/*
  - '!resources/npm/node_modules/.bin/**/*'

# Copied beside app.asar, into process.resourcesPath: the window icon has to
# be a real file on disk, not a path inside the archive (2026-09-06).
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  # The macOS menu-bar icon: a small PNG, which macOS can read (an .ico it cannot).
  - from: resources/icon-32.png
    to: icon-32.png
  # Claude Code spawns this as a stdio MCP server, so it has to be a real
  # file on disk, never a path inside the archive (permission-host.ts).
  - from: resources/locust-permission-bridge.mjs
    to: locust-permission-bridge.mjs
  - from: resources/locust-browser-bridge.mjs
    to: locust-browser-bridge.mjs
  - from: resources/locust-mcp-bridge.mjs
    to: locust-mcp-bridge.mjs
  # OpenCode starts this for a run with no shell (Ask, Plan): git that only reads (opencode-git-reads.ts).
  - from: resources/locust-git-reads.mjs
    to: locust-git-reads.mjs
  # Claude Code runs this before every command a teammate runs (command-guard.ts), so it too is a real file.
  - from: resources/locust-command-guard.mjs
    to: locust-command-guard.mjs
  # Scout's away look (scout-away.ts): Locust's pull request puts this file in the watched repository.
  - from: resources/scout-away.mjs
    to: scout-away.mjs
  # What changed, packaged WITH the build it describes -- so the notes and
  # the bytes cannot disagree, and saying so needs no network.
  - from: ../../CHANGELOG.md
    to: CHANGELOG.md
  # Memory recall's model and the WebAssembly that runs it (memory-recall.ts),
  # staged by _tools/vendor-recall.mjs. Real files: onnxruntime imports its
  # loader by URL, which cannot point inside an archive. tokenizer.json stays
  # behind -- vocab.txt is the part of it the app reads.
  # Locust's own pet (0.563, pet-library.ts): OpenPets' Hoodie Cat, MIT, its
  # licence beside it. Real files, read by the host like any other pet's.
  - from: resources/pets
    to: pets
    filter:
      - hoodie-cat/pet.json
      - hoodie-cat/spritesheet.webp
      - hoodie-cat/LICENSE
  - from: resources/recall
    to: recall
    filter:
      - model.onnx
      - vocab.txt
      - ort-wasm-simd-threaded.mjs
      - ort-wasm-simd-threaded.wasm
  # The starter routines (0.615, routine-templates.ts): ordinary routine files,
  # read by the reader an import uses. Each named, so a missing one is caught.
  - from: resources/routines
    to: routines
    filter:
      - explain-this-project.locust-routine.json
      - find-what-is-unfinished.locust-routine.json
      - review-a-file.locust-routine.json
      - council-review.locust-routine.json
      - fix-a-bug.locust-routine.json
      - build-a-feature.locust-routine.json
      - make-it-faster.locust-routine.json
      - polish-overnight.locust-routine.json
      - plan-a-change.locust-routine.json
      - challenge-an-idea.locust-routine.json
      - write-a-status-update.locust-routine.json
      - weekly-report-from-notes.locust-routine.json
      - summarize-a-long-text.locust-routine.json
      - draft-a-reply.locust-routine.json
      - check-a-spreadsheet.locust-routine.json
      - find-the-gaps-in-a-document.locust-routine.json

# Never ship the caller's mission ledger, smoke profiles, or source maps.
asar: true
# @lydell/node-pty supplies Node-API prebuilds for each packaged CPU. Never invoke a compiler on the build machine.
npmRebuild: false

# locust:// links open Locust with a message ready, never sent (0.770, src/shared/locust-link.ts). macOS reads this
# from the app's Info.plist; Windows has no installer step for it, so the installed copy claims the scheme itself
# when a person starts it (src/main/locust-links.ts `claimLinks`), and a test's copy never does.
protocols:
  - name: Locust
    schemes:
      - locust

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # No signing configured on purpose; see the note above.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Locust
  uninstallDisplayName: Locust
  artifactName: Locust-${version}-setup.${ext}

linux:
  # The 512, for the same reason the window uses it: a packager scales down
  # from what it is given, and the 256 was a downsample already.
  icon: resources/icon-512.png
  category: Development
  # Built on the public ci.yml's Ubuntu runner (0.789). Three packages, as the
  # other desktop apps people run on Linux ship: a .deb for Debian and Ubuntu,
  # an .rpm for Fedora and openSUSE, and an AppImage for everything else,
  # which is also the one that updates itself.
  executableName: locust
  synopsis: Your AI teammates, on the agents and models you choose
  description: Run AI agents as a team you can watch, on the agents and models you choose.
  vendor: Automated Workflow
  # A .deb and an .rpm must name someone; nobody reads this address.
  maintainer: Locust <noreply@locust.lol>
  # The dock and the app grid match a running window to its launcher by the window's app id, which Electron takes
  # from package.json's desktopName: the launcher is named for it, and its StartupWMClass follows.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  artifactName: Locust-${version}-linux-${arch}.${ext}

# Installed as `locust`, not as the workspace's package name.
deb:
  packageName: locust
rpm:
  packageName: locust

mac:
  icon: resources/icon-512.png
  category: public.app-category.developer-tools
  # Not signed with a Developer ID yet (that needs an Apple Developer
  # account). The builder's own signing is skipped, and scripts/adhoc-sign.cjs
  # signs the app ad hoc instead: unsigned, Apple silicon reports a
  # downloaded app as "damaged"; ad hoc, it asks once and Open Anyway works.
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: Locust-${version}-mac-${arch}.${ext}

afterSign: scripts/adhoc-sign.cjs
