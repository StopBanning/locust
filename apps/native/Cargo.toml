[package]
name = "locust-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Locust Native (preview): a native Locust window on Rune, a client of the Locust engine's local MCP server."
publish = false

[[bin]]
name = "locust-native"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pin one commit of `dev` (never rewritten). Bump on purpose, never by accident.
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }
# `mermaid` pulls rune-mermaid so ```mermaid fences draw natively (no WebView).
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["markdown", "mermaid"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
# Match the runtime adapter’s secret redaction rules at the display boundary.
regex = "1"
portable-pty = "0.9"
vt100 = "0.18"
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2"
# KaTeX-compatible math layout → PNG for replies (MathTex.tsx). embed-fonts keeps fonts in-tree.
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-types = "0.1.15"
# Read-only .xlsx (Electron xlsx.ts); no formula execution. 0.38 matches zip 2.
calamine = "0.38"
# Zip parts for .docx/.pptx text extraction (Electron office-text.ts approach).
zip = { version = "2", default-features = false, features = ["deflate", "deflate-flate2"] }

[profile.release]
codegen-units = 16

[target.'cfg(unix)'.dependencies]
# Terminate app-server's process group when the turn ends, including its child programs.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The browser's WKWebView and PDFKit, through the maintained objc2 bindings (Electron used its own Chromium and
# sandboxed pdf.js).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSProcessInfo", "NSString", "NSURL", "NSURLRequest", "NSUUID"] }
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKUserContentController", "WKUserScript", "WKScriptMessageHandler", "WKScriptMessage", "WKNavigationDelegate", "WKNavigationAction", "WKContentRuleListStore", "WKContentRuleList", "WKURLSchemeHandler", "WKURLSchemeTask", "WKFrameInfo", "WKUIDelegate", "WKWindowFeatures"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }
block2 = "0.6"
