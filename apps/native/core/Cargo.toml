[package]
name = "locust-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Locust's engine in Rust: agent drivers, ledgers, approvals and the command guard, stores, routines and usage. No UI toolkit."
publish = false

[lib]
path = "src/lib.rs"

[features]
# Test helpers the window's tests use (isolated data folders, synthetic stores). Turned on only by the window's
# dev-dependency, never in a build that ships.
test-hooks = []

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
regex = "1"
portable-pty = "0.9"
vt100 = "0.18"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2"
# Read-only .xlsx (Electron xlsx.ts); no formula execution. 0.38 matches zip 2.
calamine = "0.38"
# Zip parts for .docx/.pptx text extraction (Electron office-text.ts approach).
zip = { version = "2", default-features = false, features = ["deflate", "deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
# Terminate app-server's process group when the turn ends, including its child programs.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# PDFKit for PDF text and pages, through the maintained objc2 bindings.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSProcessInfo", "NSString", "NSURL", "NSURLRequest", "NSUUID"] }
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }
