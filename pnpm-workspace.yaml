packages:
  - apps/*
  - packages/*

# The Mac job packages both CPUs from one install. Each image needs its own PTY prebuild, without a compiler.
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]

allowBuilds:
  electron: true
  # Squirrel-target helper. We package with NSIS, so its build script is
  # refused rather than run: nothing here needs it.
  electron-winstaller: false
  esbuild: true
  # Pulled in by onnxruntime-web (a build-time dependency of memory recall).
  # Its install script only warns about version ranges; nothing needs it.
  protobufjs: false

# pdf.js offers a native canvas for drawing pages under Node. Locust draws them
# in a window of its own (main/pdf-reading.ts), so the native module is never
# needed and never installed.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'

minimumReleaseAgeExclude:
  - bot-avatars@0.1.1
