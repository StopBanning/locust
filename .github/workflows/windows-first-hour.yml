# The first hour on a bare Windows machine (_smoke/windows-first-hour-smoke.mjs),
# run against the installer an earlier ci.yml run built, so the smoke can be
# worked on in minutes instead of a full build each time. ci.yml runs the same
# smoke on every Windows build. Started by hand with that run's id. No secrets
# are used.

name: windows-first-hour

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The ci.yml run whose locust-windows-latest installer to use
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  first-hour:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The smoke's own Node, as in ci.yml. The app never sees it: it starts with a new account's PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: locust-windows-latest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: images
      - name: First hour on a bare Windows machine
        run: node _smoke/windows-first-hour-smoke.mjs "$(ls images/*-setup.exe | head -1)"
      - name: Keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-first-hour-frames
          path: |
            windows-first-hour-*.png
            windows-first-hour.log
          if-no-files-found: ignore
          retention-days: 7
