# The Rust port (apps/native) on exec/native: its tests on macOS, the scoreboard checks, its tests on Linux except those
# parity/linux-not-yet.txt names, and a compile check on Linux and Windows that is allowed to fail while the port is
# Mac-only, so each push shows what stops it building there.
# Runs on pushes to exec/native or exec/native-engine (where the port is built until it merges into exec/native) that
# touch the port, and on pull requests into exec/native-engine (28 Nov: checked batches land as pull requests, and a
# request that ran nothing of the port said nothing about it). One run at a time per branch. The macOS job runs on
# Colin's Mac mini, on pushes only: a batch has already passed the full gate on that Mac before its request opens.
# The rest run on GitHub's runners. No secrets.

name: native

on:
  push:
    branches: [exec/native, exec/native-engine]
    paths:
      - apps/native/**
      - .github/workflows/native.yml
  pull_request:
    branches: [exec/native-engine]
    paths:
      - apps/native/**
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/native

jobs:
  scoreboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checklist tables match parity/rows.tsv
        run: python3 scripts/recount.py --check
      - name: Every TypeScript test file has a line in parity/tests.tsv
        run: python3 scripts/test-ledger.py --check
      - name: The icons and marks match Electron's drawings
        run: python3 scripts/marks.py --check

  # On Colin's Mac mini (runner `mac-mini`, label locust-mac) since 11 Nov 2026: GitHub's macos-15 runners gave this
  # job none three times in a row. The runner's guard (_tools/mac-runner-guard.sh) admits this workflow only on
  # exec/native or exec/native-engine, pushed or started by the owner. The build cache lives in the runner's own folder, not GitHub's cache.
  mac:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, locust-mac]
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../../native-target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Electron's ledger reader, which checks every ledger Rust writes
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@teammate/mission-store..." build
      - name: Rust
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
      # The app is built before anything is tested: tests turn on core's test hooks, so a green suite does not prove
      # the release build compiles (f76c8744 broke it with every test passing). This fails in the first minutes.
      - name: Release build and binary size
        run: |
          cargo build --release
          size=$(stat -f %z "$CARGO_TARGET_DIR/release/locust-native")
          echo "Release binary: $((size / 1048576)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        env:
          LOCUST_TEST_TS_READER: ${{ github.workspace }}/packages/mission-store/dist/index.js
        run: cargo test --release --workspace
      - name: The engine does not depend on the UI toolkit
        run: |
          if cargo tree -p locust-core -e normal,build,dev | grep -i rune; then
            echo "locust-core depends on Rune"; exit 1
          fi

  # Every test of both crates on Linux, except those parity/linux-not-yet.txt names (notes/LINUX-NOTES.md). Unlike
  # `elsewhere`, a failure here fails the run: a test not on the list that fails, or a listed name that is no longer a
  # test. The list may only shrink.
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # ALSA's headers for the microphone crate (cpal), xkbcommon's for the window toolkit, and the sqlite3 program the
      # session_import tests build their Cursor store with (on GitHub's image already; named so it stays).
      - name: Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev sqlite3
      - name: Tests, except the listed ones
        run: bash scripts/linux-tests.sh

  elsewhere:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The microphone crate (cpal) builds alsa-sys on Linux, which needs ALSA's headers (red since 24 Nov without them).
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Compile check
        shell: bash
        run: |
          set +e
          cargo check --workspace --all-targets --message-format short 2> check.log
          status=$?
          {
            echo "### ${{ matrix.os }}: cargo check exit $status"
            echo
            echo '```'
            grep -E '^(error|warning: unused)' check.log | sort | uniq -c | sort -rn | head -40
            grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: error' check.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -40
            tail -5 check.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
