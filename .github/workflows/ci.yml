# Locust's public CI: typecheck and test on every push and pull request, and
# unsigned Windows, macOS and Linux builds when started by hand. Since
# 2026-10-30 each build is the release itself: the Mac publishes what this
# makes (_tools/publish-ci.sh). The Windows build's artifact is what SignPath
# Foundation signs once the project is accepted. No secrets are used.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: Package one system only (a release packages all three)
        type: choice
        options: [all, linux]
        default: all
      markers:
        description: Strings the release's changelog claims, one a line, that the Windows build must contain
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    # A Linux-only package run (`only: linux`, while a Linux check is being worked on) skips the Windows suite;
    # every push, pull request and release still runs it first.
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'linux'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  package:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.test.result == 'success' || (inputs.only == 'linux' && needs.test.result == 'skipped')) }}
    needs: test
    strategy:
      # Each system's images are attached by their own job's result (mac-attach-dl.sh, linux-attach-dl.sh), so a
      # Linux check that fails must not cancel the Mac build, nor the other way round.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only == 'linux' && '["ubuntu-24.04"]' || '["windows-latest", "macos-14", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage npm and the memory-recall model
        run: |
          node _tools/vendor-npm.mjs
          node _tools/vendor-recall.mjs
      - run: pnpm build
      # The .rpm is made by rpmbuild, which Ubuntu does not carry.
      - name: Packaging tools for the .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.yml --publish never
      - name: Load the packaged terminal native module (Windows)
        if: runner.os == 'Windows'
        run: node _smoke/terminal-native-smoke.mjs apps/desktop/release/win-unpacked/Locust.exe
      # A release from the Mac (2026-10-30): the PC that built Windows releases is retired, so this build is the release.
      # Its window zip is made from this build's own renderer, and what it holds is checked as ship.mjs checks it on the
      # PC: the archive, the installer, its feed, the files beside the archive and every changelog marker.
      # _tools/win-attach-dl.sh requires the PASSED line.
      - name: The window zip (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node _tools/window-zip.mjs "$(node -p "require('./apps/desktop/package.json').version")"
      - name: Check what the release holds (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LOCUST_MARKERS: ${{ inputs.markers }}
        run: node _tools/check-artifact.mjs
      - name: Load the packaged terminal native module (Mac)
        if: runner.os == 'macOS'
        run: node _smoke/terminal-native-smoke.mjs apps/desktop/release/mac-arm64/Locust.app/Contents/MacOS/Locust
      - uses: actions/upload-artifact@v4
        with:
          name: locust-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/Locust-*-window.zip
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
      # The Mac images are launched on a real Mac before they reach a release
      # (2026-10-07). The private repository's mac-build did this; the public
      # one built the images and never opened them. Minutes are free here.
      # Launch the arm64 app, run one turn on a free OpenCode model, press
      # Stop and check nothing it started is left (0.496); then install it in
      # /Applications, offer it its own disk image as a newer version, press
      # Restart and install, and check it comes back as the new copy (0.516).
      # The first hour on a Mac with nothing on it (0.712): the runner's node,
      # npm and opencode are moved out of every folder Locust searches, so the
      # npm Locust carries installs the free runtime from the first screen and
      # a first answer is timed (the smoke refuses to measure a machine that is
      # not bare). Reported, not yet required: a free provider can be down for
      # hours, and that is not Locust's to fix. Runs before anything below
      # installs OpenCode.
      - name: First hour on a bare Mac
        if: runner.os == 'macOS'
        continue-on-error: true
        # It passes in under two minutes. 0.836's hung for 43, and the job's limit then took the checks that gate the dmgs.
        timeout-minutes: 12
        run: |
          NODE="$(realpath "$(command -v node)")"
          hidden=""
          trap 'for f in $hidden; do sudo mv "$f.locust-hidden" "$f"; done' EXIT
          for d in /opt/homebrew/bin /usr/local/bin; do
            for n in node npm npx corepack opencode; do
              if [ -e "$d/$n" ] || [ -L "$d/$n" ]; then sudo mv "$d/$n" "$d/$n.locust-hidden"; hidden="$hidden $d/$n"; fi
            done
          done
          echo "moved aside for the smoke:${hidden:- nothing}"
          "$NODE" _smoke/mac-first-hour-smoke.mjs "apps/desktop/release/mac-arm64/Locust.app/Contents/MacOS/Locust"
      # 0.837: the step's limit stopped the smoke and not what it had started. The Locust it left kept the port
      # the update check then drove for 30 minutes, and the runner's node stayed moved aside. Whatever happened
      # above, none of it reaches the checks below.
      - name: Nothing left from the first hour
        if: runner.os == 'macOS' && always()
        run: |
          pkill -9 -f 'release/mac-arm64/Locust.app/Contents/MacOS/' || true
          for d in /opt/homebrew/bin /usr/local/bin; do
            for f in "$d"/*.locust-hidden; do
              if [ -e "$f" ] || [ -L "$f" ]; then sudo mv "$f" "${f%.locust-hidden}"; echo "put back ${f%.locust-hidden}"; fi
            done
          done
      - name: Keep the first hour's frames
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-first-hour-frames
          path: |
            mac-first-hour-*.png
            mac-first-hour.log
          if-no-files-found: ignore
          retention-days: 7
      # npm runs OpenCode's install script, which fetches its program, only when asked.
      - name: Install OpenCode for the Mac launch check
        if: runner.os == 'macOS'
        run: npm install -g --allow-scripts=opencode-ai opencode-ai
      - name: Launch, run and Stop on macOS
        if: runner.os == 'macOS'
        run: |
          which opencode && opencode --version
          node _smoke/posix-stop-smoke.mjs "apps/desktop/release/mac-arm64/Locust.app/Contents/MacOS/Locust"
      - name: Update itself on macOS
        if: runner.os == 'macOS'
        # It passes in under a minute and stops itself at six.
        timeout-minutes: 8
        run: node _smoke/mac-update-smoke.mjs apps/desktop/release/mac-arm64/Locust.app "$(ls apps/desktop/release/*-mac-arm64.dmg | head -1)"
      - name: Keep the update check's log
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-log
          path: mac-update.log
          if-no-files-found: ignore
          retention-days: 7
      # Linux (0.789): each package is checked the way a person meets it. The .deb is installed with apt, its
      # launcher is checked against the desktop-entry spec, and the installed app runs a turn on a free OpenCode
      # model and is stopped, with Chromium's sandbox on as the package sets it up. The AppImage is started on
      # this stock Ubuntu with nothing installed for it, and must open its window. xvfb is the screen, at a desktop's
      # 1920x1080: its default 640x480, or a laptop's 1440x900, opens the window in the narrow layout.
      - name: Linux test tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb libfuse2t64 desktop-file-utils
      - name: Install the .deb as a person would
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./$(ls apps/desktop/release/*.deb | head -1)"
          desktop-file-validate /usr/share/applications/locust.desktop
          grep -E '^(Name|Exec|Icon|MimeType|StartupWMClass|Categories)=' /usr/share/applications/locust.desktop
          ls -l /opt/Locust/chrome-sandbox
          node _smoke/terminal-native-smoke.mjs /opt/Locust/locust
          rpm -qpi "$(ls apps/desktop/release/*.rpm | head -1)" | grep -E '^(Name|Version|Architecture|Summary)'
      - name: Install OpenCode for the Linux launch check
        if: runner.os == 'Linux'
        run: npm install -g --allow-scripts=opencode-ai opencode-ai
      - name: Launch, run and Stop on Linux
        if: runner.os == 'Linux'
        run: |
          which opencode && opencode --version
          xvfb-run -a -s '-screen 0 1920x1080x24' node _smoke/posix-stop-smoke.mjs /opt/Locust/locust
      - name: The AppImage starts on a stock Ubuntu
        if: runner.os == 'Linux'
        run: |
          image="$(ls apps/desktop/release/*.AppImage | head -1)"
          chmod +x "$image"
          # What decides the AppImage's sandbox here (its launcher adds --no-sandbox only when this fails).
          unshare -Ur true && echo 'user namespaces: available' || echo 'user namespaces: refused'
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          LOCUST_SMOKE_PORT=9334 xvfb-run -a -s '-screen 0 1920x1080x24' node _smoke/posix-stop-smoke.mjs --launch-only "$image"
      - name: Update itself on Linux
        if: runner.os == 'Linux'
        run: |
          image="$(ls apps/desktop/release/*.AppImage | head -1)"
          LOCUST_SMOKE_PORT=9335 xvfb-run -a -s '-screen 0 1920x1080x24' node _smoke/linux-update-smoke.mjs "$image"
      - name: Keep the Linux frames
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-frames
          path: linux-*.png
          if-no-files-found: ignore
          retention-days: 7
